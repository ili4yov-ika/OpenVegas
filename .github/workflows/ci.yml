name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Qt 6.8
            os: ubuntu-22.04
            qt_arch: linux_gcc_64
          - name: Windows Qt 6.8
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - name: macOS Qt 6.8
            os: macos-14
            qt_arch: clang_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # qtsvg is a default archive, not an add-on module — do not pass modules: qtsvg
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.3"
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: qt-6.8.3-${{ matrix.qt_arch }}
          aqtversion: "==3.3.*"

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DOPENVGAS_BUILD_TESTS=ON \
            -DOPENVGAS_COPY_VEGAS_RUNTIME=OFF

      - name: Build app
        run: cmake --build build --target OpenVegas --parallel

      - name: Build tests
        run: cmake --build build --target openvegas_audio_tests openvegas_video_tests --parallel

      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --parallel 2
